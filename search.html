<script>

let selectedCertificate = null;


/* =========================
   SEARCH
========================= */

function searchCertificate(){

    const number = document
        .getElementById("searchNumber")
        .value
        .trim();

    const error =
        document.getElementById("error");

    const result =
        document.getElementById("result");

    error.textContent = "";
    result.style.display = "none";


    if(!number){

        error.textContent =
            "कृपया दाखला क्रमांक टाका.";

        return;
    }


    let certificates = [];

    try {

        certificates = JSON.parse(
            localStorage.getItem("certificates") || "[]"
        );

        if(!Array.isArray(certificates)){
            certificates = [];
        }

    } catch(error){

        certificates = [];

    }


    selectedCertificate =
        certificates.find(function(item){

            return String(
                item.certificateNumber || ""
            ).trim() === number;

        });


    if(!selectedCertificate){

        error.textContent =
            "हा दाखला क्रमांक सापडला नाही.";

        return;
    }


    document.getElementById("showNumber").textContent =
        selectedCertificate.certificateNumber || "";

    document.getElementById("showDate").textContent =
        selectedCertificate.certificateDate || "";

    document.getElementById("showName").textContent =
        selectedCertificate.marathiName || "";

    document.getElementById("showAadhaar").textContent =
        selectedCertificate.aadhaar || "";

    document.getElementById("showVillage").textContent =
        selectedCertificate.village || "";

    document.getElementById("showTaluka").textContent =
        selectedCertificate.taluka || "";

    document.getElementById("showDistrict").textContent =
        selectedCertificate.district || "";


    result.style.display = "block";
}


/* =========================
   EDIT
========================= */

function editCertificate(){

    if(!selectedCertificate){

        alert(
            "आधी दाखला शोधा."
        );

        return;
    }


    /* जुना दाखला current म्हणून सेव्ह */

    localStorage.setItem(
        "currentCertificate",
        JSON.stringify(
            selectedCertificate
        )
    );


    /* EDIT MODE ON */

    sessionStorage.setItem(
        "editCertificate",
        "true"
    );


    /* FORM OPEN */

    window.location.href =
        "form.html";

}


/* =========================
   PRINT
========================= */

function printCertificate(){

    if(!selectedCertificate){

        alert(
            "आधी दाखला शोधा."
        );

        return;
    }


    localStorage.setItem(
        "currentCertificate",
        JSON.stringify(
            selectedCertificate
        )
    );


    /* PRINT MODE */

    sessionStorage.removeItem(
        "editCertificate"
    );


    window.location.href =
        "certificate.html";
}


/* =========================
   ENTER KEY SEARCH
========================= */

document
.getElementById("searchNumber")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            searchCertificate();

        }

    }
);

</script>
