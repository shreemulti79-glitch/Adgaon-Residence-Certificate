<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>दाखला शोधा</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    font-family:"Noto Sans Devanagari","Mangal",Arial,sans-serif;
    background:#f2f2f2;
}

.container{
    width:95%;
    max-width:700px;
    margin:40px auto;
    background:#fff;
    padding:25px;
    border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    margin-top:0;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:11px;
    margin-top:6px;
    border:1px solid #aaa;
    border-radius:4px;
    font-size:16px;
}

button{
    border:none;
    padding:10px 18px;
    margin-top:15px;
    border-radius:4px;
    cursor:pointer;
    font-size:15px;
}

.search-btn{
    background:#0d47a1;
    color:white;
    width:100%;
}

.result{
    margin-top:25px;
    border-top:1px solid #ddd;
    padding-top:20px;
}

.row{
    padding:8px 0;
    border-bottom:1px solid #eee;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.edit{
    background:#f0ad00;
    color:#000;
}

.print{
    background:#198754;
    color:white;
}

.back{
    background:#555;
    color:white;
}

.error{
    color:red;
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h2>🔎 दाखला शोधा</h2>

<p>
दाखला क्रमांक वापरून आधी सेव्ह केलेला दाखला शोधा.
</p>

<label>दाखला क्रमांक</label>

<input
    type="text"
    id="searchNumber"
    placeholder="दाखला क्रमांक टाका"
>

<button class="search-btn" onclick="searchCertificate()">
    🔎 दाखला शोधा
</button>

<div id="error" class="error"></div>

<div id="result" class="result" style="display:none;">

    <h3>दाखला सापडला ✅</h3>

    <div class="row">
        <b>दाखला क्रमांक:</b>
        <span id="showNumber"></span>
    </div>

    <div class="row">
        <b>दिनांक:</b>
        <span id="showDate"></span>
    </div>

    <div class="row">
        <b>नाव:</b>
        <span id="showName"></span>
    </div>

    <div class="row">
        <b>आधार क्रमांक:</b>
        <span id="showAadhaar"></span>
    </div>

    <div class="row">
        <b>गाव:</b>
        <span id="showVillage"></span>
    </div>

    <div class="row">
        <b>तालुका:</b>
        <span id="showTaluka"></span>
    </div>

    <div class="row">
        <b>जिल्हा:</b>
        <span id="showDistrict"></span>
    </div>

    <div class="actions">

        <button class="edit" onclick="editCertificate()">
            ✏️ Edit
        </button>

        <button class="print" onclick="printCertificate()">
            🖨️ Print
        </button>

    </div>

</div>

<button
    class="back"
    onclick="location.href='dashboard.html'">
    ← Dashboard
</button>

</div>


<script>

let selectedCertificate = null;


/* =========================
   SEARCH CERTIFICATE
========================= */

function searchCertificate(){

    const number =
        document.getElementById("searchNumber")
        .value.trim();

    const error =
        document.getElementById("error");

    const result =
        document.getElementById("result");

    error.textContent = "";
    result.style.display = "none";

    if(!number){

        error.textContent =
            "कृपया दाखला क्रमांक टाका.";

        return;
    }


    /* =========================
       GET SAVED CERTIFICATES
    ========================= */

    const certificates =
        JSON.parse(
            localStorage.getItem("certificates") || "[]"
        );


    selectedCertificate =
        certificates.find(function(item){

            return String(item.certificateNumber)
                .trim() === number;

        });


    if(!selectedCertificate){

        error.textContent =
            "हा दाखला क्रमांक सापडला नाही.";

        return;
    }


    /* =========================
       SHOW DATA
    ========================= */

    document.getElementById("showNumber")
        .textContent =
        selectedCertificate.certificateNumber || "";

    document.getElementById("showDate")
        .textContent =
        selectedCertificate.certificateDate || "";

    document.getElementById("showName")
        .textContent =
        selectedCertificate.marathiName || "";

    document.getElementById("showAadhaar")
        .textContent =
        selectedCertificate.aadhaar || "";

    document.getElementById("showVillage")
        .textContent =
        selectedCertificate.village || "";

    document.getElementById("showTaluka")
        .textContent =
        selectedCertificate.taluka || "";

    document.getElementById("showDistrict")
        .textContent =
        selectedCertificate.district || "";


    result.style.display = "block";
}


/* =========================
   EDIT
========================= */

function editCertificate(){

    if(!selectedCertificate){
        return;
    }

    localStorage.setItem(
        "currentCertificate",
        JSON.stringify(selectedCertificate)
    );

    window.location.href = "form.html";
}


/* =========================
   PRINT
========================= */

function printCertificate(){

    if(!selectedCertificate){
        return;
    }

    localStorage.setItem(
        "currentCertificate",
        JSON.stringify(selectedCertificate)
    );

    window.location.href = "certificate.html";
}

</script>

</body>
</html>
