<!DOCTYPE html>
<html lang="mr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>नवीन रहिवासी दाखला</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    background:#f2f4f7;
    color:#222;
}

.header{
    background:#075e54;
    color:white;
    padding:18px 15px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:5px 0 0;
    font-size:15px;
}

.container{
    width:95%;
    max-width:850px;
    margin:25px auto;
}

.form-box{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 2px 12px rgba(0,0,0,0.12);
}

.form-title{
    text-align:center;
    font-size:23px;
    font-weight:bold;
    margin-bottom:22px;
    color:#075e54;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.field{
    margin-bottom:16px;
}

.field.full{
    grid-column:1 / -1;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input,
select,
textarea{
    width:100%;
    padding:11px;
    border:1px solid #bbb;
    border-radius:6px;
    font-size:16px;
    outline:none;
    background:#fff;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#075e54;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input[readonly]{
    background:#f1f1f1;
}

.btn-area{
    text-align:center;
    margin-top:20px;
}

button{
    background:#075e54;
    color:white;
    border:none;
    padding:13px 35px;
    font-size:17px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#064c44;
}

button:disabled{
    background:#777;
    cursor:not-allowed;
}

.success{
    display:none;
    margin-top:18px;
    padding:13px;
    background:#dff5e5;
    color:#176b2c;
    border:1px solid #9bd2a8;
    border-radius:6px;
    text-align:center;
    font-weight:bold;
}

.back{
    text-align:center;
    margin-top:18px;
}

.back a{
    color:#075e54;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:650px){

    .row{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .form-box{
        padding:18px;
    }

}

</style>

</head>

<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <h1>ग्रामपंचायत कार्यालय आडगाव</h1>

    <p>
        ता. भोकरदन जि. जालना
    </p>

</div>


<!-- =====================================================
     FORM
===================================================== -->

<div class="container">

<div class="form-box">

    <div class="form-title">
        नवीन रहिवासी दाखला
    </div>


    <form id="certificateForm">


        <div class="row">


            <!-- Certificate Number -->

            <div class="field">

                <label>
                    दाखला क्रमांक
                </label>

                <input
                    type="text"
                    id="certificateNumber"
                    readonly
                >

            </div>


            <!-- Certificate Date -->

            <div class="field">

                <label>
                    दाखला दिनांक
                </label>

                <input
                    type="date"
                    id="certificateDate"
                    required
                >

            </div>


            <!-- Marathi Name -->

            <div class="field">

                <label>
                    अर्जदाराचे नाव (मराठी)
                </label>

                <input
                    type="text"
                    id="marathiName"
                    placeholder="मराठी नाव टाका"
                    required
                >

            </div>


            <!-- English Name -->

            <div class="field">

                <label>
                    अर्जदाराचे नाव (English)
                </label>

                <input
                    type="text"
                    id="englishName"
                    placeholder="Enter English Name"
                    required
                >

            </div>


            <!-- Aadhaar -->

            <div class="field">

                <label>
                    आधार क्रमांक
                </label>

                <input
                    type="text"
                    id="aadhaar"
                    maxlength="12"
                    inputmode="numeric"
                    placeholder="12 अंकी आधार क्रमांक"
                    required
                >

            </div>


            <!-- Village -->

            <div class="field">

                <label>
                    गाव
                </label>

                <input
                    type="text"
                    id="village"
                    value="आडगाव"
                    required
                >

            </div>


            <!-- Taluka -->

            <div class="field">

                <label>
                    तालुका
                </label>

                <input
                    type="text"
                    id="taluka"
                    value="भोकरदन"
                    required
                >

            </div>


            <!-- District -->

            <div class="field">

                <label>
                    जिल्हा
                </label>

                <input
                    type="text"
                    id="district"
                    value="जालना"
                    required
                >

            </div>


            <!-- State -->

            <div class="field">

                <label>
                    राज्य
                </label>

                <input
                    type="text"
                    id="state"
                    value="महाराष्ट्र"
                    required
                >

            </div>


            <!-- Pincode -->

            <div class="field">

                <label>
                    पिनकोड
                </label>

                <input
                    type="text"
                    id="pincode"
                    maxlength="6"
                    inputmode="numeric"
                    value="431112"
                    required
                >

            </div>


            <!-- Resident Type -->

            <div class="field">

                <label>
                    रहिवासी प्रकार
                </label>

                <select
                    id="residentType"
                    required
                >

                    <option value="">
                        -- निवडा --
                    </option>

                    <option value="कायम">
                        कायम
                    </option>

                    <option value="तात्पुरते">
                        तात्पुरते
                    </option>

                </select>

            </div>


            <!-- Place -->

            <div class="field">

                <label>
                    ठिकाण
                </label>

                <input
                    type="text"
                    id="place"
                    value="आडगाव"
                    required
                >

            </div>


            <!-- Verification -->

            <div class="field full">

                <label>
                    पडताळणी / Verification
                </label>

                <textarea
                    id="verification"
                >सदर दाखला त्यांचे विनंती अर्जानुसार, रहिवासी पुराव्याची पडताळणी व स्थानिक चौकशीच्या आधारे देण्यात येत आहे.</textarea>

            </div>


        </div>


        <!-- SAVE -->

        <div class="btn-area">

            <button
                type="submit"
                id="saveButton"
            >
                दाखला सेव्ह करा
            </button>

        </div>


        <!-- MESSAGE -->

        <div
            id="message"
            class="success"
        ></div>


    </form>


    <div class="back">

        <a href="dashboard.html">
            ← Dashboard वर जा
        </a>

    </div>


</div>

</div>



<script>

document.addEventListener("DOMContentLoaded", function () {


    /* =====================================================
       LOGIN CHECK
    ===================================================== */

    if (
        sessionStorage.getItem("loggedIn") !== "true"
    ) {

        window.location.href = "index.html";

        return;

    }


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const certificateNumber =
        document.getElementById(
            "certificateNumber"
        );

    const certificateDate =
        document.getElementById(
            "certificateDate"
        );

    const marathiName =
        document.getElementById(
            "marathiName"
        );

    const englishName =
        document.getElementById(
            "englishName"
        );

    const aadhaar =
        document.getElementById(
            "aadhaar"
        );

    const village =
        document.getElementById(
            "village"
        );

    const taluka =
        document.getElementById(
            "taluka"
        );

    const district =
        document.getElementById(
            "district"
        );

    const state =
        document.getElementById(
            "state"
        );

    const pincode =
        document.getElementById(
            "pincode"
        );

    const residentType =
        document.getElementById(
            "residentType"
        );

    const place =
        document.getElementById(
            "place"
        );

    const verification =
        document.getElementById(
            "verification"
        );

    const form =
        document.getElementById(
            "certificateForm"
        );


    /* =====================================================
       NEW CERTIFICATE NUMBER
    ===================================================== */

   function generateCertificateNumber(){

    const START_NUMBER = 547281812524;

    let certificates = [];

    try{

        certificates = JSON.parse(
            localStorage.getItem("certificates") || "[]"
        );

        if(!Array.isArray(certificates)){
            certificates = [];
        }

    }catch(error){

        certificates = [];

    }

    let maxNumber = START_NUMBER - 1;

    certificates.forEach(function(item){

        const num = Number(item.certificateNumber);

        if(
            Number.isInteger(num) &&
            num > maxNumber
        ){
            maxNumber = num;
        }

    });

    return String(maxNumber + 1);

}

    /* =====================================================
       TODAY DATE
    ===================================================== */

    const today =
        new Date();

    const yyyy =
        today.getFullYear();

    const mm =
        String(
            today.getMonth() + 1
        ).padStart(2,"0");

    const dd =
        String(
            today.getDate()
        ).padStart(2,"0");


    certificateDate.value =
        yyyy + "-" + mm + "-" + dd;


    /* =====================================================
       LOAD EDIT DATA ONLY WHEN SEARCH EDIT FLAG EXISTS
    ===================================================== */

    let editMode = false;

    let editingNumber = "";


    const editRequest =
        sessionStorage.getItem(
            "editCertificate"
        );


    if (editRequest === "true") {

        const saved =
            localStorage.getItem(
                "currentCertificate"
            );


        if (saved) {

            try {

                const data =
                    JSON.parse(saved);


                if (
                    data &&
                    data.certificateNumber
                ) {

                    editMode = true;

                    editingNumber =
                        String(
                            data.certificateNumber
                        );


                    certificateNumber.value =
                        data.certificateNumber || "";

                    certificateDate.value =
                        data.certificateDate || "";

                    marathiName.value =
                        data.marathiName || "";

                    englishName.value =
                        data.englishName || "";

                    aadhaar.value =
                        data.aadhaar || "";

                    village.value =
                        data.village || "आडगाव";

                    taluka.value =
                        data.taluka || "भोकरदन";

                    district.value =
                        data.district || "जालना";

                    state.value =
                        data.state || "महाराष्ट्र";

                    pincode.value =
                        data.pincode || "431112";

                    residentType.value =
                        data.residentType || "";

                    place.value =
                        data.place || "आडगाव";

                    verification.value =
                        data.verification ||
                        "सदर दाखला त्यांचे विनंती अर्जानुसार, रहिवासी पुराव्याची पडताळणी व स्थानिक चौकशीच्या आधारे देण्यात येत आहे.";

                }

            } catch(error){

                console.log(error);

            }

        }

    }


    /* =====================================================
       NEW MODE
    ===================================================== */

    if (!editMode) {

        certificateNumber.value =
            generateCertificateNumber();

    }


    /* =====================================================
       INPUT VALIDATION
    ===================================================== */

    aadhaar.addEventListener(
        "input",
        function(){

            this.value =
                this.value.replace(
                    /\D/g,
                    ""
                );

        }
    );


    pincode.addEventListener(
        "input",
        function(){

            this.value =
                this.value.replace(
                    /\D/g,
                    ""
                );

        }
    );


    /* =====================================================
       SAVE
    ===================================================== */

    form.addEventListener(
        "submit",
        function(e){

            e.preventDefault();


            if (
                aadhaar.value.length !== 12
            ){

                alert(
                    "कृपया 12 अंकी आधार क्रमांक टाका."
                );

                return;

            }


            if (
                pincode.value.length !== 6
            ){

                alert(
                    "कृपया 6 अंकी पिनकोड टाका."
                );

                return;

            }


            if (
                residentType.value === ""
            ){

                alert(
                    "कृपया रहिवासी प्रकार निवडा."
                );

                return;

            }


            const certificate = {

                certificateNumber:
                    certificateNumber.value.trim(),

                certificateDate:
                    certificateDate.value,

                marathiName:
                    marathiName.value.trim(),

                englishName:
                    englishName.value.trim(),

                aadhaar:
                    aadhaar.value.trim(),

                village:
                    village.value.trim(),

                taluka:
                    taluka.value.trim(),

                district:
                    district.value.trim(),

                state:
                    state.value.trim(),

                pincode:
                    pincode.value.trim(),

                residentType:
                    residentType.value,

                place:
                    place.value.trim(),

                verification:
                    verification.value.trim()

            };


            /* =================================================
               CURRENT CERTIFICATE
            ================================================= */

            localStorage.setItem(
                "currentCertificate",
                JSON.stringify(
                    certificate
                )
            );


            /* =================================================
               ALL CERTIFICATES
            ================================================= */

            let certificates = [];


            try {

                certificates =
                    JSON.parse(
                        localStorage.getItem(
                            "certificates"
                        ) || "[]"
                    );


                if (
                    !Array.isArray(
                        certificates
                    )
                ){

                    certificates = [];

                }

            } catch(error){

                certificates = [];

            }


            /* =================================================
               UPDATE / ADD
            ================================================= */

            if (editMode) {

                const index =
                    certificates.findIndex(
                        function(item){

                            return String(
                                item.certificateNumber || ""
                            ) === editingNumber;

                        }
                    );


                if (index !== -1){

                    certificates[index] =
                        certificate;

                } else {

                    certificates.push(
                        certificate
                    );

                }

            } else {

                certificates.push(
                    certificate
                );

            }


            localStorage.setItem(
                "certificates",
                JSON.stringify(
                    certificates
                )
            );


            /* =================================================
               CLEAR EDIT MODE
            ================================================= */

            sessionStorage.removeItem(
                "editCertificate"
            );


            /* =================================================
               SUCCESS
            ================================================= */

            const message =
                document.getElementById(
                    "message"
                );


            message.style.display =
                "block";


            message.innerHTML =
                "✅ माहिती Successfully Save झाली!<br>" +
                "Certificate तयार होत आहे...";


            const saveButton =
                document.getElementById(
                    "saveButton"
                );


            saveButton.disabled =
                true;

            saveButton.innerText =
                "Saved ✓";


            /* =================================================
               CERTIFICATE
            ================================================= */

            setTimeout(
                function(){

                    window.location.href =
                        "certificate.html";

                },
                700
            );

        }
    );

});

</script>

</body>
</html>
