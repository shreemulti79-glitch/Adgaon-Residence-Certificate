<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>नवीन रहिवासी दाखला</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#f1f3f6;
    font-family:"Noto Sans Devanagari","Arial",sans-serif;
}

.form-container{
    max-width:1100px;
    margin:auto;
    background:#fff;
    padding:28px;
    border-radius:12px;
    box-shadow:0 2px 15px rgba(0,0,0,0.08);
}

h1{
    text-align:center;
    color:#00695c;
    margin:0 0 30px 0;
    font-size:28px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:26px 20px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

label{
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
    color:#111;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    font-size:17px;
    border:1px solid #bbb;
    border-radius:7px;
    outline:none;
    background:#fff;
    font-family:inherit;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#00695c;
}

input[readonly]{
    background:#f1f1f1;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.full-width{
    grid-column:1 / -1;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:30px;
}

button{
    border:0;
    border-radius:7px;
    padding:13px 30px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn{
    background:#00695c;
    color:white;
}

.reset-btn{
    background:#777;
    color:white;
}

.back-btn{
    background:#333;
    color:white;
}

button:hover{
    opacity:.9;
}

@media(max-width:700px){

    body{
        padding:10px;
    }

    .form-container{
        padding:18px;
    }

    .form-grid{
        grid-template-columns:1fr;
        gap:20px;
    }

    .full-width{
        grid-column:auto;
    }

    h1{
        font-size:24px;
    }

}

</style>
</head>

<body>

<div class="form-container">

<h1>नवीन रहिवासी दाखला</h1>

<form id="form">

<div class="form-grid">


<!-- दाखला क्रमांक -->

<div class="form-group">

<label for="certificateNumber">
दाखला क्रमांक
</label>

<input
    type="text"
    id="certificateNumber"
    name="certificateNumber"
    readonly
>

</div>


<!-- दाखला दिनांक -->

<div class="form-group">

<label for="certificateDate">
दाखला दिनांक
</label>

<input
    type="date"
    id="certificateDate"
    name="certificateDate"
    required
>

</div>


<!-- English नाव FIRST -->

<div class="form-group">

<label for="englishName">
अर्जदाराचे नाव (English)
</label>

<input
    type="text"
    id="englishName"
    name="englishName"
    placeholder="Enter English Name"
    autocomplete="off"
    required
>

</div>


<!-- Marathi नाव AUTOMATIC -->

<div class="form-group">

<label for="marathiName">
अर्जदाराचे नाव (मराठी)
</label>

<input
    type="text"
    id="marathiName"
    name="marathiName"
    placeholder="मराठी नाव येथे दिसेल"
    readonly
>

</div>


<!-- आधार -->

<div class="form-group">

<label for="aadhaar">
आधार क्रमांक
</label>

<input
    type="text"
    id="aadhaar"
    name="aadhaar"
    maxlength="12"
    inputmode="numeric"
    placeholder="12 अंकी आधार क्रमांक"
    required
>

</div>


<!-- गाव -->

<div class="form-group">

<label for="village">
गाव
</label>

<input
    type="text"
    id="village"
    name="village"
    value="आडगाव"
    required
>

</div>


<!-- तालुका -->

<div class="form-group">

<label for="taluka">
तालुका
</label>

<input
    type="text"
    id="taluka"
    name="taluka"
    value="भोकरदन"
    required
>

</div>


<!-- जिल्हा -->

<div class="form-group">

<label for="district">
जिल्हा
</label>

<input
    type="text"
    id="district"
    name="district"
    value="जालना"
    required
>

</div>


<!-- राज्य -->

<div class="form-group">

<label for="state">
राज्य
</label>

<input
    type="text"
    id="state"
    name="state"
    value="महाराष्ट्र"
    required
>

</div>


<!-- पिनकोड -->

<div class="form-group">

<label for="pincode">
पिनकोड
</label>

<input
    type="text"
    id="pincode"
    name="pincode"
    value="431112"
    maxlength="6"
    inputmode="numeric"
    required
>

</div>


<!-- रहिवासी प्रकार -->

<div class="form-group">

<label for="residentType">
रहिवासी प्रकार
</label>

<select
    id="residentType"
    name="residentType"
    required
>

<option value="">-- निवडा --</option>

<option value="कायम रहिवासी">
कायम रहिवासी
</option>

<option value="तात्पुरता रहिवासी">
तात्पुरता रहिवासी
</option>

</select>

</div>


<!-- ठिकाण -->

<div class="form-group">

<label for="place">
ठिकाण
</label>

<input
    type="text"
    id="place"
    name="place"
    value="आडगाव"
    required
>

</div>


<!-- Verification -->

<div class="form-group full-width">

<label for="verification">
पडताळणी / Verification
</label>

<textarea
    id="verification"
    name="verification"
    placeholder="पडताळणी मजकूर"
></textarea>

</div>


</div>


<div class="buttons">

<button
    type="submit"
    class="save-btn"
>
    दाखला तयार करा
</button>

<button
    type="reset"
    class="reset-btn"
>
    Reset
</button>

<button
    type="button"
    class="back-btn"
    onclick="window.location.href='dashboard.html'"
>
    मागे
</button>

</div>

</form>

</div>


<script>

/* ==========================
   Login Check
========================== */

if(sessionStorage.getItem("loggedIn") !== "true"){

    window.location.href = "index.html";

}


/* ==========================
   Elements
========================== */

const form =
    document.getElementById("form");

const certificateNumber =
    document.getElementById("certificateNumber");

const certificateDate =
    document.getElementById("certificateDate");

const marathiName =
    document.getElementById("marathiName");

const englishName =
    document.getElementById("englishName");

const aadhaar =
    document.getElementById("aadhaar");

const village =
    document.getElementById("village");

const taluka =
    document.getElementById("taluka");

const district =
    document.getElementById("district");

const state =
    document.getElementById("state");

const pincode =
    document.getElementById("pincode");

const residentType =
    document.getElementById("residentType");

const place =
    document.getElementById("place");

const verification =
    document.getElementById("verification");


/* ==========================
   आजची तारीख
========================== */

function setTodayDate(){

    const today = new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            today.getDate()
        ).padStart(2,"0");

    certificateDate.value =
        year + "-" + month + "-" + day;

}


/* ==========================
   दाखला क्रमांक
   547281812524 पासून
========================== */

function generateCertificateNumber(){

    const START_NUMBER =
        547281812524;

    let certificates = [];

    try{

        certificates = JSON.parse(
            localStorage.getItem(
                "certificates"
            ) || "[]"
        );

        if(!Array.isArray(certificates)){

            certificates = [];

        }

    }catch(error){

        certificates = [];

    }


    let maxNumber =
        START_NUMBER - 1;


    certificates.forEach(function(item){

        const value =
            String(
                item.certificateNumber || ""
            ).trim();


        /*
          फक्त आपल्या
          547281812xxx
          नंबरना मोजायचे
        */

        if(/^547281812\d+$/.test(value)){

            const num =
                Number(value);


            if(
                Number.isInteger(num) &&
                num >= START_NUMBER &&
                num > maxNumber
            ){

                maxNumber = num;

            }

        }

    });


    return String(
        maxNumber + 1
    );

}


/* ==========================
   English → Marathi
========================== */

let transliterationTimer = null;


englishName.addEventListener(
    "input",
    function(){

        clearTimeout(
            transliterationTimer
        );


        const englishText =
            englishName.value.trim();


        if(!englishText){

            marathiName.value = "";

            return;

        }


        /*
          थोडा delay ठेवला आहे
          म्हणजे प्रत्येक अक्षरावर
          request जाणार नाही.
        */

        transliterationTimer =
            setTimeout(function(){

                convertEnglishToMarathi(
                    englishText
                );

            },500);

    }
);


/* ==========================
   Google Transliteration
========================== */

function convertEnglishToMarathi(
    text
){

    const url =
        "https://inputtools.google.com/request" +
        "?text=" +
        encodeURIComponent(text) +
        "&itc=mr-t-i0-und" +
        "&num=5" +
        "&cp=0" +
        "&cs=1" +
        "&ie=utf-8" +
        "&oe=utf-8";


    fetch(url)

    .then(function(response){

        return response.json();

    })

    .then(function(data){

        if(
            data &&
            data[0] === "SUCCESS" &&
            data[1] &&
            data[1][0] &&
            data[1][0][1] &&
            data[1][0][1].length > 0
        ){

            /*
              पहिला Marathi suggestion
            */

            marathiName.value =
                data[1][0][1][0];

        }

    })

    .catch(function(error){

        console.log(
            "Marathi conversion error:",
            error
        );

    });

}


/* ==========================
   Edit Mode
========================== */

const editMode =
    sessionStorage.getItem(
        "editCertificate"
    ) === "true";


if(editMode){

    try{

        const currentCertificate =
            JSON.parse(
                localStorage.getItem(
                    "currentCertificate"
                ) || "null"
            );


        if(currentCertificate){

            certificateNumber.value =
                currentCertificate
                .certificateNumber || "";

            certificateDate.value =
                currentCertificate
                .certificateDate || "";

            englishName.value =
                currentCertificate
                .englishName || "";

            marathiName.value =
                currentCertificate
                .marathiName || "";

            aadhaar.value =
                currentCertificate
                .aadhaar || "";

            village.value =
                currentCertificate
                .village || "आडगाव";

            taluka.value =
                currentCertificate
                .taluka || "भोकरदन";

            district.value =
                currentCertificate
                .district || "जालना";

            state.value =
                currentCertificate
                .state || "महाराष्ट्र";

            pincode.value =
                currentCertificate
                .pincode || "431112";

            residentType.value =
                currentCertificate
                .residentType || "";

            place.value =
                currentCertificate
                .place || "आडगाव";

            verification.value =
                currentCertificate
                .verification || "";

        }

    }catch(error){

        console.log(error);

    }

}else{

    certificateNumber.value =
        generateCertificateNumber();

    setTodayDate();

}


/* ==========================
   Form Submit
========================== */

form.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        /* आधार validation */

        const aadhaarValue =
            aadhaar.value.trim();


        if(!/^\d{12}$/.test(
            aadhaarValue
        )){

            alert(
                "कृपया 12 अंकी आधार क्रमांक टाका."
            );

            aadhaar.focus();

            return;

        }


        /* पिनकोड validation */

        const pincodeValue =
            pincode.value.trim();


        if(!/^\d{6}$/.test(
            pincodeValue
        )){

            alert(
                "कृपया 6 अंकी पिनकोड टाका."
            );

            pincode.focus();

            return;

        }


        /* Marathi नाव check */

        if(!marathiName.value.trim()){

            alert(
                "कृपया English नाव टाका आणि Marathi नाव तयार होऊ द्या."
            );

            englishName.focus();

            return;

        }


        /* Certificate object */

        const certificate = {

            certificateNumber:
                certificateNumber.value.trim(),

            certificateDate:
                certificateDate.value,

            marathiName:
                marathiName.value.trim(),

            englishName:
                englishName.value.trim(),

            aadhaar:
                aadhaarValue,

            village:
                village.value.trim(),

            taluka:
                taluka.value.trim(),

            district:
                district.value.trim(),

            state:
                state.value.trim(),

            pincode:
                pincodeValue,

            residentType:
                residentType.value,

            place:
                place.value.trim(),

            verification:
                verification.value.trim()

        };


        /* Current Certificate */

        localStorage.setItem(
            "currentCertificate",
            JSON.stringify(
                certificate
            )
        );


        /* Certificates Array */

        let certificates = [];

        try{

            certificates = JSON.parse(
                localStorage.getItem(
                    "certificates"
                ) || "[]"
            );

            if(!Array.isArray(
                certificates
            )){

                certificates = [];

            }

        }catch(error){

            certificates = [];

        }


        /* ==========================
           Edit
        ========================== */

        if(editMode){

            const editNumber =
                certificate.certificateNumber;


            const index =
                certificates.findIndex(
                    function(item){

                        return String(
                            item.certificateNumber
                        ) === String(
                            editNumber
                        );

                    }
                );


            if(index !== -1){

                certificates[index] =
                    certificate;

            }else{

                certificates.push(
                    certificate
                );

            }


        }else{

            certificates.push(
                certificate
            );

        }


        /* Save */

        localStorage.setItem(
            "certificates",
            JSON.stringify(
                certificates
            )
        );


        /* Edit flag clear */

        sessionStorage.removeItem(
            "editCertificate"
        );


        /* Certificate */

        window.location.href =
            "certificate.html";

    }
);


/* ==========================
   Reset
========================== */

form.addEventListener(
    "reset",
    function(){

        setTimeout(function(){

            if(!editMode){

                certificateNumber.value =
                    generateCertificateNumber();

                setTodayDate();

                marathiName.value = "";

            }

        },10);

    }
);

</script>

</body>
</html>
