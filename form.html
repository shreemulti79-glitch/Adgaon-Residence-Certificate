<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>नवीन रहिवासी दाखला</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans Devanagari", sans-serif;
            background: #f3f6fa;
            color: #222;
        }

        /* Header */

        .header {
            background: #0d47a1;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 14px;
        }

        .back-btn {
            background: white;
            color: #0d47a1;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 7px;
            font-weight: bold;
        }

        /* Container */

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.10);
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h2 {
            color: #0d47a1;
            margin-bottom: 5px;
        }

        .title p {
            color: #777;
            margin: 0;
        }

        /* Form */

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 18px;
        }

        .field {
            width: 100%;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        label span {
            color: red;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
            font-family: inherit;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #1976d2;
        }

        .full {
            margin-bottom: 18px;
        }

        /* Buttons */

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 13px 28px;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .save {
            background: #1976d2;
            color: white;
        }

        .save:hover {
            background: #0d47a1;
        }

        .reset {
            background: #757575;
            color: white;
        }

        .reset:hover {
            background: #424242;
        }

        /* Message */

        #message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        /* Mobile */

        @media (max-width: 650px) {

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .form-box {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <div>
        <h1>ग्रामपंचायत आडगाव</h1>
        <p>रहिवासी दाखला प्रणाली</p>
    </div>

    <a href="dashboard.html" class="back-btn">
        ← Dashboard
    </a>

</div>


<!-- FORM -->

<div class="container">

    <div class="form-box">

        <div class="title">

            <h2>नवीन रहिवासी दाखला</h2>

            <p>
                Residence Certificate
            </p>

        </div>


        <form id="certificateForm">

            <!-- Certificate Number + Date -->

            <div class="row">

                <div class="field">

                    <label>
                        दाखला क्रमांक <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="certificateNumber"
                        placeholder="दाखला क्रमांक"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        दिनांक <span>*</span>
                    </label>

                    <input
                        type="date"
                        id="certificateDate"
                        required
                    >

                </div>

            </div>


            <!-- Name -->

            <div class="full">

                <label>
                    अर्जदाराचे पूर्ण नाव <span>*</span>
                </label>

                <input
                    type="text"
                    id="marathiName"
                    placeholder="उदा. राजेश तुकाराम साळवे"
                    required
                >

            </div>


            <!-- English Name -->

            <div class="full">

                <label>
                    Applicant Name (English)
                </label>

                <input
                    type="text"
                    id="englishName"
                    placeholder="उदा. Rajesh Tukaram Salve"
                >

            </div>


            <!-- Aadhaar -->

            <div class="full">

                <label>
                    आधार क्रमांक <span>*</span>
                </label>

                <input
                    type="text"
                    id="aadhaar"
                    maxlength="12"
                    inputmode="numeric"
                    placeholder="12 अंकी आधार क्रमांक"
                    required
                >

            </div>


            <!-- Village / Taluka -->

            <div class="row">

                <div class="field">

                    <label>
                        गाव <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="village"
                        value="आडगाव"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        तालुका <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="taluka"
                        value="भोकरदन"
                        required
                    >

                </div>

            </div>


            <!-- District / State -->

            <div class="row">

                <div class="field">

                    <label>
                        जिल्हा <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="district"
                        value="जालना"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        राज्य <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="state"
                        value="महाराष्ट्र"
                        required
                    >

                </div>

            </div>


            <!-- Pincode -->

            <div class="row">

                <div class="field">

                    <label>
                        पिनकोड <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="pincode"
                        maxlength="6"
                        inputmode="numeric"
                        value="431112"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        रहिवासी प्रकार <span>*</span>
                    </label>

                    <select id="residentType" required>

                        <option value="">
                            निवडा
                        </option>

                        <option value="कायम">
                            कायम रहिवासी
                        </option>

                        <option value="तात्पुरते">
                            तात्पुरते रहिवासी
                        </option>

                    </select>

                </div>

            </div>


            <!-- Place -->

            <div class="full">

                <label>
                    ठिकाण
                </label>

                <input
                    type="text"
                    id="place"
                    value="आडगाव"
                >

            </div>


            <!-- Verification -->

            <div class="full">

                <label>
                    दाखला देण्याचा आधार
                </label>

                <textarea id="verification">सदर दाखला त्यांचे विनंती अर्जानुसार, रहिवासी पुराव्याची पडताळणी व स्थानिक चौकशीच्या आधारे देण्यात येत आहे.</textarea>

            </div>


            <!-- Buttons -->

            <div class="buttons">

                <button
                    type="submit"
                    class="save">
                    💾 Save & Continue
                </button>

                <button
                    type="reset"
                    class="reset">
                    Reset
                </button>

            </div>


            <div id="message"></div>

        </form>

    </div>

</div>


<script>

    /* Login Check */

    if (sessionStorage.getItem("loggedIn") !== "true") {

        window.location.href = "index.html";

    }


    /* Today's Date */

    const today = new Date();

    const yyyy = today.getFullYear();

    const mm = String(today.getMonth() + 1).padStart(2, "0");

    const dd = String(today.getDate()).padStart(2, "0");

    document.getElementById("certificateDate").value =
        `${yyyy}-${mm}-${dd}`;


    /* Certificate Number */

    function generateCertificateNumber() {

        const random =
            Math.floor(100000000000 + Math.random() * 900000000000);

        return random.toString();

    }

    document.getElementById("certificateNumber").value =
        generateCertificateNumber();


    /* Aadhaar Validation */

    document.getElementById("aadhaar").addEventListener(
        "input",
        function() {

            this.value = this.value.replace(/\D/g, "");

        }
    );


    /* Pincode Validation */

    document.getElementById("pincode").addEventListener(
        "input",
        function() {

            this.value = this.value.replace(/\D/g, "");

        }
    );


    /* Submit */

    document.getElementById("certificateForm").addEventListener(
        "submit",
        function(e) {

            e.preventDefault();

            const aadhaar =
                document.getElementById("aadhaar").value;

            const pincode =
                document.getElementById("pincode").value;


            if (aadhaar.length !== 12) {

                alert("कृपया 12 अंकी आधार क्रमांक टाका.");

                return;

            }


            if (pincode.length !== 6) {

                alert("कृपया 6 अंकी पिनकोड टाका.");

                return;

            }


            /* Temporary local save */

            const data = {

                certificateNumber:
                    document.getElementById("certificateNumber").value,

                certificateDate:
                    document.getElementById("certificateDate").value,

                marathiName:
                    document.getElementById("marathiName").value,

                englishName:
                    document.getElementById("englishName").value,

                aadhaar:
                    aadhaar,

                village:
                    document.getElementById("village").value,

                taluka:
                    document.getElementById("taluka").value,

                district:
                    document.getElementById("district").value,

                state:
                    document.getElementById("state").value,

                pincode:
                    pincode,

                residentType:
                    document.getElementById("residentType").value,

                place:
                    document.getElementById("place").value,

                verification:
                    document.getElementById("verification").value

            };


            localStorage.setItem(
                "currentCertificate",
                JSON.stringify(data)
            );


            const message =
                document.getElementById("message");

            message.className = "success";

            message.style.display = "block";

          message.innerHTML =
    "✅ माहिती Save झाली! Certificate तयार होत आहे...";

setTimeout(function() {

    window.location.href = "certificate.html";

}, 500);
        }
    );

</script>

</body>
</html>
