<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adgaon Residence Certificate - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
        }

        .login-box {
            width: 380px;
            max-width: 92%;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 23px;
            color: #0d47a1;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
            color: #555;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #1976d2;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        #error {
            display: none;
            margin-top: 15px;
            padding: 10px;
            background: #ffebee;
            color: #c62828;
            border-radius: 7px;
            text-align: center;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="header">
        <h1>ग्रामपंचायत आडगाव</h1>
        <p>रहिवासी दाखला प्रणाली</p>
    </div>

    <form id="loginForm">

        <label for="username">Login ID</label>

        <input
            type="text"
            id="username"
            placeholder="Login ID टाका"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Password टाका"
            required
        >

        <button type="submit">
            Login
        </button>

        <div id="error">
            Login ID किंवा Password चुकीचा आहे.
        </div>

    </form>

    <div class="footer">
        Grampanchayat Office Adgaon<br>
        Tal. Bhokardan, Dist. Jalna
    </div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    const correctUsername = "Adgaon Panchayt";
    const correctPassword = "Adgaon@123";

    if (username === correctUsername && password === correctPassword) {

        sessionStorage.setItem("loggedIn", "true");

        window.location.href = "dashboard.html";

    } else {

        document.getElementById("error").style.display = "block";

    }

});

</script>

</body>
</html>
